<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Home Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #95a5a6;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #2c3e50;
        }

        .tab.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .form-actions {
            margin-top: 25px;
        }

        .form-actions .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Home Assistant</h1>
            <p>Zaloguj sie lub utworz konto</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Logowanie</div>
            <div class="tab" onclick="showTab('register')">Rejestracja</div>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <!-- Login Form -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="twoj@email.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Haslo</label>
                    <input type="password" id="login-password" required placeholder="Twoje haslo">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Zaloguj sie</button>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-name">Imie</label>
                    <input type="text" id="register-name" placeholder="Twoje imie (opcjonalne)">
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required placeholder="twoj@email.com">
                </div>
                <div class="form-group">
                    <label for="register-password">Haslo</label>
                    <input type="password" id="register-password" required minlength="6" placeholder="Min. 6 znakow">
                </div>
                <div class="form-group">
                    <label for="register-password2">Powtorz haslo</label>
                    <input type="password" id="register-password2" required placeholder="Powtorz haslo">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Zarejestruj sie</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

            document.querySelector(`.tab:nth-child(${tab === 'login' ? 1 : 2})`).classList.add('active');
            document.getElementById(`${tab}-form`).classList.add('active');

            hideMessages();
        }

        function showError(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login/json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        haslo: password,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Blad logowania');
                }

                localStorage.setItem('token', data.access_token);
                window.location.href = '/';
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideMessages();

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const password2 = document.getElementById('register-password2').value;

            if (password !== password2) {
                showError('Hasla nie sa identyczne');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        haslo: password,
                        imie: name || null,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Blad rejestracji');
                }

                showSuccess('Konto utworzone! Mozesz sie teraz zalogowac.');
                showTab('login');
                document.getElementById('login-email').value = email;
            } catch (error) {
                showError(error.message);
            }
        }
    </script>
</body>
</html>
