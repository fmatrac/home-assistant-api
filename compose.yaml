services:
  # Reverse Proxy z autentykacją
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Backend - teraz niedostępny z zewnątrz (brak ports)
  backend:
    build: .
    ports:
      - "5001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres
    # ports usunięte dla bezpieczeństwa - baza niedostępna z zewnątrz
    expose:
      - "5432"
    environment:
      POSTGRES_USER: home_assistant_user
      POSTGRES_PASSWORD: home_assistant_password
      POSTGRES_DB: home_assistant
    volumes:
      - ./db-data/:/var/lib/postgresql
      - ./db-init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_assistant_user -d home_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
